# Builds Linux and Windows on every push/PR to main. Pushes to main then
# publish both outputs together to the rolling "latest-build" release,
# which the in-app updater uses for fallback downloads
# (internal/update). Publishing from one job avoids the two builds
# racing to update the same release.
#
#   build-linux    → dist/oxis, dist/deb/oxis_<ver>_amd64.deb,
#                    dist/oxis-<ver>-linux-portable.tar.gz
#   build-macos    → dist/oxis-<ver>-macos-arm64.zip (OXIS.app; artifact only)
#   build-windows  → dist/wix/oxis-<ver>.msi and the bare dist/oxis.exe
#                    ('update install can only swap in a bare binary)

name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write # needed to create/update the "latest-build" release and version tags

# Stamped into every build (scripts/buildstamp.js) and shown by 'version.
env:
  OXIS_CHANNEL: ${{ github.event_name == 'push' && 'latest-build' || 'pr' }}

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # history and tags for the build number (no old file contents)
          filter: blob:none

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dpkg-dev pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build
        run: |
          chmod +x build-linux.sh
          ./build-linux.sh

      # After the build: the tests compile the embedded frontend it copies
      # into internal/server/dist.
      # A failing test's lines also become annotations, which anyone can
      # read on the run's page (the log needs a sign-in).
      - name: Test
        run: |
          set -o pipefail # else the step gets tee's status, and failing tests pass
          if ! go test -tags desktop,production,webkit2_41 ./internal/... 2>&1 | tee test.log; then
            grep -E '^\s+\S+_test\.go:[0-9]+:|^--- FAIL|^FAIL' test.log | head -30 | sed -E 's/^\s*/::error::/'
            exit 1
          fi

      # The terminal's own logic (output, colours, sessions, suggestions,
      # symbols), without a window.
      - name: Frontend tests
        working-directory: frontend
        run: npm test

      - name: Stage release files
        run: |
          mkdir -p release-files
          cp dist/oxis release-files/
          cp dist/deb/oxis_*_amd64.deb release-files/
          cp dist/oxis-*-linux-portable.tar.gz release-files/

      - uses: actions/upload-artifact@v4
        with:
          name: oxis-linux-${{ github.sha }}
          path: release-files/
          retention-days: 30

  # macOS (Apple silicon): OXIS.app, zipped. Not in the release yet.
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - uses: actions/setup-go@v5
        with:
          # Go 1.22's object files are refused by Xcode 26's linker.
          go-version: "stable"

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Build
        run: node scripts/build-go.js

      - name: Test
        env:
          CGO_LDFLAGS: -framework UniformTypeIdentifiers
        run: |
          set -o pipefail # else the step gets tee's status, and failing tests pass
          if ! go test -tags desktop,production ./internal/... 2>&1 | tee test.log; then
            grep -E '^\s+\S+_test\.go:[0-9]+:|^--- FAIL|^FAIL' test.log | head -30 | sed -E 's/^\s*/::error::/'
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: oxis-macos-${{ github.sha }}
          path: dist/oxis-*-macos-*.zip
          retention-days: 30

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # history and tags for the build number (no old file contents)
          filter: blob:none

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      # windows-latest usually ships WiX 3.14 already; only install it when
      # missing (pinning a version over a newer preinstalled patch fails).
      - name: Install WiX Toolset (if not already present)
        run: |
          $candle = "C:\Program Files (x86)\WiX Toolset v3.14\bin\candle.exe"
          if (Test-Path $candle) {
            Write-Host "WiX Toolset v3.14 already present at $candle — skipping install"
          } else {
            choco install wixtoolset --version=3.14.1 -y --no-progress
          }
        shell: pwsh

      # Native Lua for plugins (internal/luanative) is built with cgo:
      # put a MinGW-w64 gcc on PATH (the image usually has one).
      - name: C compiler for cgo
        run: |
          $gcc = Get-Command gcc -ErrorAction SilentlyContinue
          if (-not $gcc) {
            foreach ($dir in "C:\mingw64\bin", "C:\msys64\mingw64\bin", "C:\ProgramData\mingw64\mingw64\bin") {
              if (Test-Path "$dir\gcc.exe") { $dir | Out-File -Append -Encoding utf8 $env:GITHUB_PATH; $gcc = $dir; break }
            }
          }
          if (-not $gcc) {
            choco install mingw -y --no-progress
            "C:\ProgramData\mingw64\mingw64\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          }
        shell: pwsh

      - name: Build (frontend + Go binary)
        run: npm run build
        shell: cmd

      - name: Test
        run: |
          set CGO_ENABLED=1
          go test -tags desktop,production ./internal/... > test.log 2>&1
          set status=%errorlevel%
          type test.log
          if not %status%==0 (
            powershell -NoProfile -Command "Select-String -Path test.log -Pattern '^\s+\S+_test\.go:\d+:','^--- FAIL','^FAIL' | Select-Object -First 30 | ForEach-Object { '::error::' + $_.Line.Trim() }"
            exit /b 1
          )
        shell: cmd

      - name: Build MSI installer
        run: npm run build:msi
        shell: cmd

      - name: Stage release files
        run: |
          mkdir release-files
          copy dist\wix\oxis-*.msi release-files\
          copy dist\oxis.exe release-files\
        shell: cmd

      - uses: actions/upload-artifact@v4
        with:
          name: oxis-windows-${{ github.sha }}
          path: release-files/
          retention-days: 30

  # Never publish from a pull request.
  publish-release:
    needs: [build-linux, build-windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # Replacing a release file starts its download count from zero, so
      # the files are only replaced when the app changed since the build
      # they came from (where the latest-build tag points). Docs,
      # screenshots, the website, the Market listing and tests don't
      # change what people download. internal/update/update.go skips the
      # same files (notAppFiles); keep the two patterns the same.
      - name: Did the app change since the last published build?
        id: app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev="$(gh api "repos/${{ github.repository }}/git/ref/tags/latest-build" --jq .object.sha 2>/dev/null || true)"
          if [ -z "$prev" ]; then echo "publish=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          cmp="$(gh api "repos/${{ github.repository }}/compare/$prev...${{ github.sha }}")"
          files="$(jq -r '.files[]?.filename' <<<"$cmp")"
          not_app='^(README\.md|CHANGELOG\.md|CONTRIBUTING\.md|LICENSE|assets/|cloudflare/|market/|npm/|\.github/ISSUE_TEMPLATE/)|_test\.go$|\.test\.ts$|\.test-util\.ts$|/testdata/'
          # GitHub lists at most 300 files: more than that counts as a change.
          if [ "$(jq '.files | length' <<<"$cmp")" -ge 300 ] || [ -z "$files" ] || grep -vqE "$not_app" <<<"$files"; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only docs, the website or tests changed since $prev: the release files (and their download counts) stay."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        if: steps.app.outputs.publish == 'true'
        with:
          name: oxis-linux-${{ github.sha }}
          path: release-files

      - uses: actions/download-artifact@v4
        if: steps.app.outputs.publish == 'true'
        with:
          name: oxis-windows-${{ github.sha }}
          path: release-files

      # The release action only creates the tag; move it to this build so
      # it always points at the commit the files were built from.
      - name: Point the latest-build tag at this commit
        if: steps.app.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PATCH "repos/${{ github.repository }}/git/refs/tags/latest-build" -f sha="${{ github.sha }}" -F force=true \
            || gh api -X POST "repos/${{ github.repository }}/git/refs" -f ref=refs/tags/latest-build -f sha="${{ github.sha }}"

      # Bumping the version in package.json tags the first build of main
      # that carries it as v<version>.
      - uses: actions/checkout@v4
        with:
          path: src
          sparse-checkout: package.json
          sparse-checkout-cone-mode: false

      - name: Tag a new version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./src/package.json').version")"
          if gh api "repos/${{ github.repository }}/git/ref/tags/v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION already tagged"
          else
            gh api -X POST "repos/${{ github.repository }}/git/refs" -f ref="refs/tags/v$VERSION" -f sha="${{ github.sha }}"
          fi

      # GitHub counts downloads per file, and the next step replaces the
      # files, which starts their counts from zero. The count so far is
      # kept in a comment in the release notes: the total, and each
      # current file's count by asset id (a file that doesn't get
      # replaced keeps its id, so it isn't counted twice). The website
      # and the README's downloads badge (cloudflare/functions/
      # downloads.js) add the new files' downloads to it.
      - name: Carry the download count forward
        if: steps.app.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! rel="$(gh api "repos/${{ github.repository }}/releases/tags/latest-build" 2>gh-error.txt)"; then
            # No release yet starts from zero; anything else would lose the count.
            grep -q "HTTP 404" gh-error.txt || { cat gh-error.txt; exit 1; }
            rel='{}'
          fi
          count="$(jq -c '
            (([(.body // "") | capture("<!-- downloads: (?<j>\\{[^>]*\\}) -->")][0].j // "{}") | try fromjson catch {}) as $m
            | ($m.seen // {}) as $seen
            | [(.assets // [])[] | {id: (.id | tostring), n: .download_count}] as $files
            | {total: (($m.total // 0) + ([$files[] | [.n - ($seen[.id] // 0), 0] | max] | add // 0)),
               seen: ($files | map({key: .id, value: .n}) | from_entries)}' <<<"$rel")"
          echo "Downloads so far: $(jq .total <<<"$count")"
          cat > release-notes.md <<EOF
          Automatically built from commit ${{ github.sha }}: the most
          recent successful build of main, not a tagged release.

          <!-- downloads: $count -->
          EOF

      - name: Publish rolling "latest-build" release
        if: steps.app.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: "Latest build"
          body_path: release-notes.md
          prerelease: true
          make_latest: false
          files: release-files/*