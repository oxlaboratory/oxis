# OXIS 2 (the native Rust rewrite, docs/v2/README.md): build and test the
# Cargo workspace on Linux and Windows for every push to the v2 branch and
# every pull request into it. Nothing here publishes a release.

name: v2

on:
  push:
    branches: [v2]
  pull_request:
    branches: [v2]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbcommon-dev libxkbcommon-x11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libwayland-dev xvfb libgl1-mesa-dri libegl1

      - name: Build
        run: cargo build --workspace --all-targets --locked

      # The window tests (crates/oxis-app/tests/drive.rs) open a hidden
      # window and drive it, so Linux gets a virtual X display with Mesa's
      # software OpenGL; Windows runners have a desktop already.
      - name: Test (Linux)
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a -s "-screen 0 1920x1080x24" cargo test --workspace --locked

      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: cargo test --workspace --locked

      - name: Window snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots-${{ matrix.os }}
          path: target/tmp/drive-artifacts/
          if-no-files-found: ignore
