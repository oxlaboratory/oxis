# OXIS 2 (the native Rust rewrite, docs/v2/README.md): build and test the
# Cargo workspace on Linux and Windows for every push to the v2 branch and
# every pull request into it. Nothing here publishes a release.

name: v2

on:
  push:
    branches: [v2]
  pull_request:
    branches: [v2]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbcommon-dev libxkbcommon-x11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libwayland-dev xvfb libgl1-mesa-dri libegl1

      - name: Build
        run: cargo build --workspace --all-targets --locked

      # The window tests (crates/oxis-app/tests/drive.rs) open a hidden
      # window and drive it. CI machines have no GPU, so both get Mesa's
      # software OpenGL: Linux on a virtual X display, Windows through
      # Mesa's opengl32.dll placed next to the binary (Windows' own is
      # OpenGL 1.1 only).
      - name: Software OpenGL (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          curl.exe -sSLo mesa.7z https://github.com/pal1000/mesa-dist-win/releases/download/26.2.2/mesa3d-26.2.2-release-msvc.7z
          7z e mesa.7z "x64\*.dll" -otarget\debug -y | Out-Null
          Get-ChildItem target\debug\*.dll | Select-Object Name, Length

      - name: Test
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
        run: |
          set -o pipefail
          if [ "$RUNNER_OS" = Linux ]; then run="xvfb-run -a -s '-screen 0 1920x1080x24'"; else run=""; fi
          eval $run cargo test --workspace --locked 2>&1 | tee test.log

      # Test failures as annotations, readable without opening the log.
      - name: Report failures
        if: failure()
        shell: bash
        run: |
          "$(command -v python3 || command -v python)" .github/scripts/test-failures.py

      - name: Window snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots-${{ matrix.os }}
          path: target/tmp/drive-artifacts/
          if-no-files-found: ignore
