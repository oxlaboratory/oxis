# ══════════════════════════════════════════════════════════════════
# GitLab CI — builds the Linux binary + .deb on every push.
#
#   build:linux → dist/oxis (binary) + dist/deb/oxis_<ver>_amd64.deb
#
# Windows builds are done locally (Visual Studio / npm run build) —
# see README § Getting Started — rather than through CI, so there's
# no Windows runner to register or maintain here. If that ever
# changes, see this file's git history for the previous build:windows
# job (WiX-based .msi, needs a real Windows machine as a runner).
#
# No `tags:` on build:linux — it runs on any available runner, shared
# or project-level. GitLab.com (and most self-managed instances) ship
# shared runners that pick up untagged jobs automatically, so this
# just works with nothing to register.
#
# package.json pins "engines": { "node": ">=24.0.0" }, and
# scripts/build-go.js hard-fails below that — so this installs Node's
# *current LTS line* (setup_lts.x) rather than a fixed old major, so
# it keeps working as LTS rolls forward instead of quietly drifting
# below 24 again.
# ══════════════════════════════════════════════════════════════════

stages:
  - build

variables:
  GIT_DEPTH: "1"

build:linux:
  stage: build
  image: golang:1.22-bookworm
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq curl ca-certificates dpkg-dev
    # setup_lts.x always tracks whatever Node release is *current LTS*
    # right now (Node 24.x as of writing) — see nodesource/distributions.
    - curl -fsSL https://deb.nodesource.com/setup_lts.x | bash -
    - apt-get install -y -qq nodejs
    - node -v
    - npm -v
    - go version
  script:
    - chmod +x build-linux.sh
    - ./build-linux.sh
  artifacts:
    name: "oxis-linux-$CI_COMMIT_SHORT_SHA"
    paths:
      - dist/oxis
      - dist/deb/oxis_*_amd64.deb
    expire_in: 30 days