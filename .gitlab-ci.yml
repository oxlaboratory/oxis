# ══════════════════════════════════════════════════════════════════
# GitLab CI — builds OXIS for both platforms on every push.
#
#   build:linux    → dist/oxis (binary) + dist/oxis_<ver>_amd64.deb
#   build:windows  → dist/oxis.exe + dist/oxis-<ver>.msi
#
# Requires a Linux runner tagged "linux" and a Windows runner tagged
# "windows" (GitLab.com's default shared runners are Linux-only, so
# the Windows job needs a runner you register yourself — a Windows
# VM/machine with `gitlab-runner register` and the "windows" tag —
# unless your GitLab instance already provides one). See README.md
# § Continuous Integration for setup notes.
#
# Both package.json files pin "engines": { "node": ">=24.0.0" }, and
# scripts/build-go.js hard-fails below that — so both jobs install
# Node's *current LTS line* rather than a fixed old major, so they
# keep working as LTS rolls forward instead of quietly drifting below
# 24 again.
# ══════════════════════════════════════════════════════════════════

stages:
  - build

variables:
  GIT_DEPTH: "1"

# ── Linux: binary + .deb ─────────────────────────────────────────
build:linux:
  stage: build
  tags: [linux]
  image: golang:1.22-bookworm
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq curl ca-certificates dpkg-dev
    # setup_lts.x always tracks whatever Node release is *current LTS*
    # right now (Node 24.x as of writing) — see nodesource/distributions.
    - curl -fsSL https://deb.nodesource.com/setup_lts.x | bash -
    - apt-get install -y -qq nodejs
    - node -v
    - npm -v
    - go version
  script:
    - chmod +x build-linux.sh
    - ./build-linux.sh
  artifacts:
    name: "oxis-linux-$CI_COMMIT_SHORT_SHA"
    paths:
      - dist/oxis
      - dist/oxis_*_amd64.deb
    expire_in: 30 days

# ── Windows: .exe + .msi installer ───────────────────────────────
# npm run build (scripts/build-go.js) compiles dist/oxis.exe, then
# automatically runs scripts/build-msi.js to produce the .msi (via
# WiX) — see that script's own fallback to an NSIS .exe installer if
# WiX isn't present. Installing Go/Node/WiX here via choco assumes a
# fresh runner; drop steps your runner's image already includes.
build:windows:
  stage: build
  tags: [windows]
  before_script:
    # "nodejs-lts" tracks Chocolatey's current LTS package (Node
    # 24.x as of writing) — matches the ">=24.0.0" engines requirement.
    - choco install -y golang nodejs-lts wixtoolset --no-progress
    - refreshenv
    - go version
    - node -v
    - npm -v
  script:
    - npm run build
  artifacts:
    name: "oxis-windows-$CI_COMMIT_SHORT_SHA"
    paths:
      - dist/oxis.exe
      - dist/oxis-*.msi
      - dist/oxis-*-setup.exe
    expire_in: 30 days