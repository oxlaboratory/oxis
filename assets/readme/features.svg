    <text y="166" fill="#8b98a8" font-family="'Segoe UI Variable Display','Segoe UI',Inter,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="17"><tspan x="32" dy="0">PowerShell, bash, zsh or fish — your</tspan><tspan x="32" dy="26">profile, aliases and tools in 24-bit</tspan><tspan x="32" dy="26">colour. vim, htop and lazygit run too.</tspan></text>
