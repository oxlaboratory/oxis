# Cloudflare Pages configuration for the OXIS Market — see README §
# Cloudflare Deployment for the full setup walkthrough.
#
# Deploys from github.com/oxlaboratory/oxis's cloudflare/ directory —
# make sure Cloudflare Pages' own "connected repository" setting in
# its dashboard actually points there (that setting lives in the
# dashboard, not in this file).

name = "oxis-market"
pages_build_output_dir = "."

# ── KV namespaces ─────────────────────────────────────────────────
# Create both with `wrangler kv namespace create OXIS_LICENSES` /
# `OXIS_PREMIUM_SOURCE`, then paste the real ids below (or bind them
# in the Cloudflare dashboard -> Pages project -> Settings ->
# Functions -> KV namespace bindings, which is equivalent and doesn't
# require committing real namespace ids to this file).
#
# [[kv_namespaces]]
# binding = "OXIS_LICENSES"
# id = "REPLACE_WITH_REAL_NAMESPACE_ID"
#
# [[kv_namespaces]]
# binding = "OXIS_PREMIUM_SOURCE"
# id = "REPLACE_WITH_REAL_NAMESPACE_ID"

# ── GitHub pull-request automation (fully-automatic 'plugin publish
# minus auto-merge — a human still reviews/merges on GitHub) ────────
# See functions/submit-plugin.js and functions/lib/github.js. Needs a
# GITHUB_TOKEN secret (below, same pattern as the Stripe secrets) — a
# fine-grained Personal Access Token scoped to just this repo, with
# Contents: Read and write, and Pull requests: Read and write. It
# only ever creates branches/commits/PRs through this function — it
# never needs (and shouldn't be granted) permission to merge anything
# itself.

# ── Secrets (NOT set here — see .dev.vars.example) ─────────────────
# STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, STRIPE_PUBLISHABLE_KEY, and
# now GITHUB_TOKEN (see above) are configured as encrypted environment
# variables in the Cloudflare Pages dashboard (Settings -> Environment
# variables -> Production / Preview), or in a local, gitignored
# `.dev.vars` for `wrangler pages dev`. Never in this file, which is
# committed.